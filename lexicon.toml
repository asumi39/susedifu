# susedifu lexicon — single source of truth for words and etymology.
# Migrated in full from Documents/words.ods on 2026-11-07 (the ODS was removed; see git history).
# pos and etym were drafted by the agent on 2026-11-07 and are pending owner review.
# Entries with id ≥ 65 were added after the ODS migration (bound morphemes, owner-approved 2026-11-08).
#
# Entries are grouped into semantic sections (marked by comment banners); within a
# section, a root is followed by its derivatives. `id` preserves the original ODS
# row number — it is provenance only, NOT the file order.
#
# One [[word]] block per entry.
# Fields:
#   id      — original ODS row number (provenance)
#   word    — word form (lowercase Latin, no spaces)
#   pos     — part of speech (';' separates senses)
#   en      — English gloss (primary; drafted by the agent, pending owner review)
#   zh      — original Chinese gloss from the ODS (kept for reference)
#   etym    — root decomposition; "(root)" = no decomposition attested
#   variant — attested variant spelling, only when one exists
#   note    — usage notes [optional]
#
# The original ODS had one unlabeled row above the table: "susedifu | dati | johua" —
# likely a legend; kept here until the owner clarifies it.

# ────────────────────────────── 1 · Bound morphemes ──────────────────────────────

[[word]]
id = 67
word = "ma"
pos = "bound morpheme"
en = "female (gender morpheme; clipped from mama)"
zh = "女（mama 的略縮詞素，僅見於複合詞）"
