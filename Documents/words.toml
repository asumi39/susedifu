#   id      — original ODS row number
#   word    — word form (lowercase Latin, no spaces)
#   en      — English gloss (primary; drafted by the agent, pending owner review)
#   zh      — original Chinese gloss from the ODS (kept for reference)
#   variant — attested variant spelling, only when one exists
#   etym    — root decomposition, e.g. "hosi + we"; empty = root word [to fill]
#   pos     — part of speech [to fill]
#   note    — usage notes [optional]
#
# The original ODS had one unlabeled row above the table: "susedifu | dati | johua" —
# likely a legend; kept here until the owner clarifies it.

